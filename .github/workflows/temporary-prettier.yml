name: Temporary Prettier Fix
on:
  push:
    branches:
      - feat/database-authentication-phase-4-5
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/database-authentication-phase-4-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx prettier --write src/features/auth/auth.errors.ts src/features/auth/auth.schemas.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/auth.errors.ts src/features/auth/auth.schemas.test.ts
          git commit -m "fix: apply Prettier formatting"
          git push
