name: Format Phase 6

on:
  push:
    branches:
      - feat/competition-registration-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competition-registration-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the repository Prettier formatter
        run: npx prettier --write docs/ARCHITECTURE.md src/app/App.tsx src/features/participant/ParticipantPages.tsx src/features/participant/ParticipantPages.module.scss src/features/participant/ParticipantPages.test.ts src/features/participant/registration.schemas.ts tests/participant-routes.spec.ts
      - name: Verify repository formatting
        run: npm run format:check
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ARCHITECTURE.md src/app/App.tsx src/features/participant/ParticipantPages.tsx src/features/participant/ParticipantPages.module.scss src/features/participant/ParticipantPages.test.ts src/features/participant/registration.schemas.ts tests/participant-routes.spec.ts src/features/participant/registration.schemas.ts tests/participant-routes.spec.ts
          if git diff --cached --quiet; then
            echo "Prettier produced no changes."
          else
            git commit -m "style(phase-6): apply Prettier formatting"
            git push origin feat/competition-registration-dashboard
          fi
