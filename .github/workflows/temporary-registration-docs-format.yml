name: Temporary registration docs formatting

on:
  push:
    branches:
      - feat/phase-6-registration-workflow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/PARTICIPANT_REGISTRATION.md
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/PARTICIPANT_REGISTRATION.md
            git commit -m "style: format participant registration guide"
            git push origin HEAD:feat/phase-6-registration-workflow
          fi
