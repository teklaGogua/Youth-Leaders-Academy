name: Temporary unified registration formatter

on:
  push:
    branches:
      - fix/unified-registration-experience

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-registration-experience
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/registration/RegistrationPage.tsx tests/auth-pages.spec.ts
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/registration/RegistrationPage.tsx tests/auth-pages.spec.ts
            git commit -m "style: format unified registration page"
            git push origin HEAD:fix/unified-registration-experience
          fi
