name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the actual Prettier formatter and capture changed files
        run: |
          npm run format
          git diff --name-only
          for file in src/app/App.tsx src/features/participant/ParticipantPages.tsx src/features/participant/ParticipantPages.module.scss; do
            printf '\\n<<<BEGIN:%s>>>\\n' "$file"
            cat "$file"
            printf '\\n<<<END:%s>>>\\n' "$file"
          done

      - run: npm run format:check

      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Upload compiled build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: academy-build-output
          path: dist/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npm run e2e

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-responsive-screenshots
          path: test-results/
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        id: setup-supabase
        with:
          version: 2.58.5

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and synthetic seed
        run: supabase db reset

      - name: Run PostgreSQL and RLS tests
        run: supabase test db

      - name: Stop local Supabase
        if: always() && steps.setup-supabase.outcome == 'success'
        run: supabase stop --no-backup
