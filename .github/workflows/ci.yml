name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format
      - run: npm run format:check

      - name: Export formatted source to workflow logs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'AGENTS.md',
            'CHANGE-MANIFEST.md',
            'docs/ARCHITECTURE.md',
            'docs/STATUS.md',
            'docs/SUPABASE_SETUP.md',
            'src/app/App.tsx',
            'src/features/auth/auth.schemas.test.ts',
            'src/features/auth/AuthPages.tsx',
            'src/lib/database.types.ts',
            'src/lib/env.ts',
          ];
          for (const file of files) {
            console.log('FORMAT_FILE:' + file + ':' + JSON.stringify(fs.readFileSync(file, 'utf8')));
          }
          NODE

      - name: Upload Prettier-formatted source for review
        uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-source
          path: |
            AGENTS.md
            CHANGE-MANIFEST.md
            docs/ARCHITECTURE.md
            docs/STATUS.md
            docs/SUPABASE_SETUP.md
            src/app/App.tsx
            src/features/auth/auth.schemas.test.ts
            src/features/auth/AuthPages.tsx
            src/lib/database.types.ts
            src/lib/env.ts
      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Upload compiled build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: academy-build-output
          path: dist/

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npm run e2e

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-responsive-screenshots
          path: test-results/
          if-no-files-found: ignore
