name: Temporary Phase 6 formatting

on:
  push:
    branches:
      - feat/phase-6-registration-workflow

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format tracked project files
        run: npx prettier --write .
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format phase 6 implementation"
            git push origin HEAD:feat/phase-6-registration-workflow
          fi
